name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true
        type: string
      publish_pip:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: true
      publish_extension:
        description: 'Publish VS Code Extension'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update versions
        run: |
          sed -i "s/^version = .*/version = \"${{ inputs.version }}\"/" pip/pyproject.toml
          cd extension && npm pkg set version="${{ inputs.version }}"

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pip/pyproject.toml extension/package.json
          git commit -m "release: v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --tags

  publish-pip:
    if: ${{ inputs.publish_pip }}
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: pip install build && cd pip && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pip/dist/

  publish-extension:
    if: ${{ inputs.publish_extension }}
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and compile
        working-directory: extension
        run: npm install && npm run compile

      - name: Publish to VS Code Marketplace
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "$VSCE_PAT"
