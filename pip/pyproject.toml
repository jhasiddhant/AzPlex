[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azplex"
version = "1.0.0"
description = "MCP server for Azure, Microsoft Fabric, and Azure DevOps — deploy, manage, and orchestrate from one interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Siddhant Jha"}
]
dependencies = [
    "mcp>=0.1.0",
]
keywords = ["mcp", "azure", "fabric", "devops", "bicep", "azplex"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/jhasiddhant/azplex"
Repository = "https://github.com/jhasiddhant/azplex"
Issues = "https://github.com/jhasiddhant/azplex/issues"

[project.scripts]
azplex = "azplex.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azplex = ["scripts/*.ps1", "templates/*.bicep", "templates/*.yml", "AGENT_INSTRUCTIONS.md"]
